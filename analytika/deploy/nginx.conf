# /etc/nginx/sites-available/analytika — HTTPS uchun: sudo certbot --nginx -d hisobot.example.uz
server {
    server_name hisobot.example.uz;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # AI tahlil 1-2 daqiqa davom etishi mumkin
    }
}
