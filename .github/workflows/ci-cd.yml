# CI/CD: every push and pull request runs the tests.
# A push to crm whose tests pass triggers a deployment in Coolify (deploy/COOLIFY.md).
name: CI/CD

on:
  push:
    branches: [crm]
  pull_request:
    branches: [crm]
  workflow_dispatch:

# A newer push cancels the older run still in progress: only the latest commit gets deployed
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Demo build
        run: npm run build:demo

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/crm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Stray spaces/newlines from copy-paste are removed; a pasted "Bearer " prefix is tolerated
          webhook="$(printf '%s' "$COOLIFY_WEBHOOK" | tr -d '[:space:]')"
          token="$(printf '%s' "$COOLIFY_TOKEN" | tr -d '[:space:]')"
          token="${token#Bearer}"
          if [ -z "$webhook" ] || [ -z "$token" ]; then
            echo "::warning::COOLIFY_WEBHOOK / COOLIFY_TOKEN secrets are not set - deployment skipped (see deploy/COOLIFY.md)"
            exit 0
          fi
          # Clear message instead of a curl error; secret values are never printed
          case "$webhook" in
            https://*/api/v1/deploy*) ;;
            *)
              case "$webhook" in
                *'|'*) hint="it looks like an API token - are COOLIFY_WEBHOOK and COOLIFY_TOKEN swapped?" ;;
                *) hint="it must be the full deploy URL: https://<coolify>/api/v1/deploy?uuid=<app-uuid>&force=false" ;;
              esac
              echo "::error::COOLIFY_WEBHOOK is not a Coolify deploy URL - $hint (see deploy/COOLIFY.md)"
              exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "$webhook" \
            --header "Authorization: Bearer $token"
          echo
          echo "Deployment queued in Coolify - follow it under the application's Deployments tab."
