# CI/CD: every push and pull request runs the tests.
# A push to crm whose tests pass triggers a deployment in Coolify (deploy/COOLIFY.md).
name: CI/CD

on:
  push:
    branches: [crm]
  pull_request:
    branches: [crm]
  workflow_dispatch:

# A newer push cancels the older run still in progress: only the latest commit gets deployed
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Demo build
        run: npm run build:demo

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/crm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK / COOLIFY_TOKEN secrets are not set - deployment skipped (see deploy/COOLIFY.md)"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
          echo
          echo "Deployment queued in Coolify - follow it under the application's Deployments tab."
