<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Do'st</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ================= DESIGN TOKENS ================= */
:root{
  --bg:#f4f4f1; --surface:#fff; --fill:#e9e9e4; --bar:rgba(255,255,255,.94);
  --ink:#121815; --ink-2:#4b5550; --ink-3:#8a928e; --line:#e5e5e0; --line-2:#efefeb;
  --brand:#1e4d3a; --brand-600:#276049; --brand-50:#ebf2ee; --brand-fg:#1e4d3a;
  --gold:#94650f; --gold-50:#fbf3e1; --gold-200:#ecd7a5; --gold-bg:#fffcf5;
  --red:#c2372c; --red-50:#fdecea; --blue:#1d6fd1; --blue-50:#e8f1fc; --green:#238a55; --ph-a:#eeece6; --ph-b:#e0ddd4; --scrim:rgba(10,18,14,.45);
  --shadow-float:0 8px 24px rgba(18,24,21,.10);
  --font:"Inter",-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --t-display:700 28px/34px var(--font); --t-title:700 22px/28px var(--font);
  --t-headline:600 17px/24px var(--font); --t-body:400 15px/22px var(--font);
  --t-callout:500 14px/20px var(--font); --t-caption:500 12px/16px var(--font);
  --r-md:12px; --r-lg:16px; --r-xl:24px; --gutter:20px;
}
.phone[data-theme="dark"]{
  --bg:#0e1311; --surface:#171d1a; --fill:#252c29; --bar:rgba(23,29,26,.94);
  --ink:#eef1ef; --ink-2:#b3bbb7; --ink-3:#7d8682; --line:#29302d; --line-2:#222926;
  --brand:#2f7d5d; --brand-600:#389069; --brand-50:#18271f; --brand-fg:#79cca5;
  --gold:#d3a444; --gold-50:#2b2415; --gold-200:#5a4822; --gold-bg:#1f1b12;
  --red:#ef6b61; --red-50:#3a1b18; --blue:#5aa2ff; --blue-50:#152438; --green:#57c38a; --ph-a:#1d2421; --ph-b:#252d29; --scrim:rgba(0,0,0,.6);
  --shadow-float:0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(circle at 30% 20%,#2a332f,#0e1311 70%);font:var(--t-body);display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ================= DEVICE: iPhone 17 Pro Max (440×956pt) ================= */
#stage{width:462px;height:978px;transform-origin:center;flex:none}
.device{position:relative;width:462px;height:978px;border-radius:67px;padding:4px;
  background:linear-gradient(135deg,#e9e7e3 0%,#a9a6a0 22%,#d8d6d1 50%,#9c9993 78%,#e2e0dc 100%);
  box-shadow:0 0 0 1px #6f6c67,0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.5)}
.device>i{position:absolute;width:3px;border-radius:2px;background:linear-gradient(90deg,#8d8a84,#c9c6c0)}
.device>.b-act{left:-3px;top:150px;height:30px}.device .b-vu{left:-3px;top:210px;height:56px}.device .b-vd{left:-3px;top:278px;height:56px}
.device .b-pw{right:-3px;top:236px;height:88px;background:linear-gradient(270deg,#8d8a84,#c9c6c0)}
.device .b-cc{right:-2px;top:560px;height:52px;width:2px;background:#8f8c86}
.bezel{width:100%;height:100%;border-radius:63px;background:#050505;padding:7px}
.phone{position:relative;width:100%;height:100%;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);font:var(--t-body);font-feature-settings:"cv11"}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:120}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;padding:19px 34px 0 44px;display:flex;justify-content:space-between;font:600 16px/20px var(--font);z-index:110;pointer-events:none;background:var(--bg);color:var(--ink);transition:background .2s}
.statusbar.clear{background:none}.statusbar.dark{background:none;color:#fff}
.statusbar .r{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:120;pointer-events:none}

/* ================= LAYOUT ================= */
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:62px var(--gutter) 120px;display:none;background:var(--bg);scrollbar-width:none}
.screen.on{display:block}
.screen.notab{padding-bottom:48px}
.screen::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t-display{font:var(--t-display);letter-spacing:-.022em}
.t-title{font:var(--t-title);letter-spacing:-.018em}
.t-headline{font:var(--t-headline);letter-spacing:-.01em}
.t-callout{font:var(--t-callout)}
.t-caption{font:var(--t-caption)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.center{text-align:center}
.dragging,.dragging *{cursor:grabbing!important;user-select:none}

/* ================= COMPONENTS ================= */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:var(--r-md);background:var(--brand);color:#fff;font:600 16px/20px var(--font);transition:background .15s,transform .1s,opacity .15s;text-align:center}
.btn:active{transform:scale(.985);background:var(--brand-600)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.phone[data-theme="dark"] .btn.gold{color:#1a1408}
.btn.danger{background:var(--red);color:#fff}
.btn.text{background:none;color:var(--brand-fg);height:44px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none;color:var(--ink);position:relative}
.icon-btn.float{box-shadow:var(--shadow-float)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:16px}
.nav .t-headline{flex:1;text-align:center}
.nav .sp{width:40px}
.large-title{font:var(--t-display);letter-spacing:-.022em;margin:4px 0 16px}
.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.section a,.link{font:var(--t-callout);color:var(--brand-fg);font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter);scrollbar-width:none;cursor:grab}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:var(--t-callout);white-space:nowrap;color:var(--ink);flex:none}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font:700 11px/1 var(--font);letter-spacing:.04em;background:var(--brand-50);color:var(--brand-fg);flex:none}
.badge.top{background:var(--gold-50);color:var(--gold)}
.badge.gray{background:var(--fill);color:var(--ink-2);letter-spacing:0}
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;font:var(--t-body);position:relative;color:var(--ink)}
.cell+.cell::before,details+details::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line-2)}
button.cell:active,a.cell:active{background:var(--fill)}
.cell .ic{color:var(--ink-2);display:flex}
.cell .val{margin-left:auto;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.cell .lbl{color:var(--ink-2)}
.cell .rt{margin-left:auto;font-weight:500}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand-50);color:var(--brand-fg);display:grid;place-items:center;font:600 15px/1 var(--font);flex:none}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--brand-50);color:var(--brand-fg);border-radius:var(--r-md);padding:12px 14px;font:var(--t-callout)}
.callout b{font-weight:600}
.empty{text-align:center;padding:64px 12px}
.empty .ei{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.switch{margin-left:auto;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:#34a36f}.switch.on::after{transform:translateX(20px)}

/* photos */
.photo{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ph-a),var(--ph-b))}
.photo canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .2s}
.photo canvas.painted{opacity:1}
.photo .ph-fb{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3)}
.photo .ph-fb div{display:flex;flex-direction:column;align-items:center;gap:6px;font:var(--t-caption)}

/* listing card + row */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;cursor:pointer;position:relative}
.card>.photo{height:160px}
.card .body{padding:12px 14px 14px}
.price{font:700 17px/22px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.title{font:var(--t-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font:var(--t-caption);color:var(--ink-3);display:flex;align-items:center;gap:4px;margin-top:4px}
.save{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);color:#121815;display:grid;place-items:center;z-index:2}
.card>.badge{position:absolute;top:10px;left:10px;z-index:2}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter) 2px;scrollbar-width:none;cursor:grab}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{width:230px;flex:none}
.lrow{display:flex;gap:14px;padding:14px 0;cursor:pointer;position:relative}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow>.photo{width:112px;height:112px;border-radius:var(--r-md);flex:none}
.lrow .b{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .save{position:static;background:none;color:var(--ink);width:32px;height:32px;margin:-6px -6px 0 0}
.lrow .meta:last-child{margin-top:auto}

/* ================= SCREENS ================= */
#s-welcome{padding:0;background:var(--surface)}
.w-hero{height:520px;position:relative;overflow:hidden}
.w-hero>.photo{position:absolute;inset:0;background:#1e4d3a}
.w-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 30%,transparent 65%,rgba(0,0,0,.2));pointer-events:none}
.w-logo{position:absolute;top:70px;left:24px;display:flex;align-items:center;gap:8px;color:#fff;font:700 18px/1 var(--font);z-index:2}
.w-logo i{width:30px;height:30px;border-radius:9px;background:#fff;color:#1e4d3a;display:grid;place-items:center}
.w-body{padding:28px 24px 0}
.w-list{margin:20px 0 28px;display:flex;flex-direction:column;gap:14px}
.w-list div{display:flex;gap:12px;align-items:center;font:var(--t-callout);color:var(--ink-2)}
.w-list i{width:32px;height:32px;border-radius:10px;background:var(--brand-50);color:var(--brand-fg);display:grid;place-items:center;flex:none}

.loc{display:flex;align-items:center;gap:10px}
.loc .l1{font:var(--t-caption);color:var(--ink-3)}
.loc .l2{font:var(--t-headline);display:flex;align-items:center;gap:4px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-md);padding:0 6px 0 14px;height:48px;margin:16px 0 14px;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:var(--t-body);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search .f{width:36px;height:36px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--ink);position:relative}
.search .f .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.promo{display:flex;gap:14px;align-items:center;background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:16px;margin-top:24px;cursor:pointer;width:100%}
.promo i{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.promo .sub{color:rgba(255,255,255,.75);font:400 13px/18px var(--font)}

/* detail */
#s-detail{padding:0 0 150px}
.gal{height:400px;position:relative}
.gal::before{content:"";position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(color-mix(in srgb,var(--bg) 75%,transparent),transparent);z-index:2;pointer-events:none}
.gal-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.gal-track::-webkit-scrollbar{display:none}
.gal-track>.photo{flex:0 0 100%;height:100%;scroll-snap-align:start}
.gal .icon-btn{position:absolute;top:60px;z-index:3}
.gal .acts{position:absolute;right:20px;top:60px;display:flex;gap:10px;z-index:3}
.gal .acts .icon-btn{position:static}
.pager{position:absolute;right:16px;bottom:40px;background:rgba(18,24,21,.6);color:#fff;font:var(--t-caption);padding:4px 10px;border-radius:99px;z-index:3}
.dsheet{background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;margin-top:-24px;position:relative;padding:24px var(--gutter) 0;z-index:2}
.cta{display:none;position:absolute;left:0;right:0;bottom:0;padding:12px var(--gutter) 34px;background:var(--bar);backdrop-filter:blur(20px);box-shadow:0 -1px 0 var(--line);gap:10px;z-index:60}
.cta.on{display:flex}
.cta .btn.secondary{width:auto;padding:0 18px}

/* post */
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--brand)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{aspect-ratio:1;border-radius:var(--r-md);border:1.5px dashed var(--ink-3);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;font:var(--t-caption);text-align:center;position:relative;overflow:hidden}
.ph .in{display:flex;flex-direction:column;align-items:center;gap:6px}
.ph.filled{border:0}
.ph.main{grid-column:span 2;grid-row:span 2}
.ph .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;z-index:2}
.ph .mainlbl{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:3px 7px;font:var(--t-caption);z-index:2}
.field label{display:block;font:var(--t-callout);font-weight:600;color:var(--ink);margin-bottom:8px}
.field .hint{font:400 12px/16px var(--font);color:var(--ink-3);margin-top:6px}
.field .err{font:500 12px/16px var(--font);color:var(--red);margin-top:6px;display:none}
.field.invalid .err{display:block}.field.invalid .inp{box-shadow:inset 0 0 0 1.5px var(--red)}
.inp{width:100%;height:50px;border-radius:var(--r-md);border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);padding:0 14px;outline:0;font:var(--t-body);color:var(--ink);appearance:none}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{box-shadow:inset 0 0 0 2px var(--brand)}
.inp:disabled{color:var(--ink-3)}
textarea.inp{height:110px;padding:13px 14px;resize:none}
.suffix{position:relative}.suffix>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:500}
.seg{display:flex;background:var(--fill);border-radius:var(--r-md);padding:3px}
.seg button{flex:1;height:40px;border-radius:9px;font:var(--t-callout);color:var(--ink-2);text-align:center}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ok{width:72px;height:72px;border-radius:50%;background:var(--brand-50);color:var(--brand-fg);display:grid;place-items:center;margin:0 auto 20px}
.otp{letter-spacing:.9em;text-align:center;font:600 26px/1 var(--font);height:64px;padding-left:.9em}

/* promote */
.plan{display:flex;gap:14px;align-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-lg);padding:16px;cursor:pointer;width:100%}
.plan.on{box-shadow:inset 0 0 0 2px var(--gold);background:var(--gold-bg)}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3);flex:none}
.plan.on .radio{box-shadow:inset 0 0 0 7px var(--gold)}
.plan .pr{margin-left:auto;text-align:right}
.benefit{display:flex;gap:12px;align-items:center;color:var(--ink-2)}
.benefit svg{color:var(--brand-fg)}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mini{display:flex;gap:10px;align-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-md);padding:8px;width:100%}
.mini>.photo{width:44px;height:44px;border-radius:8px;flex:none}

/* profile & messages */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:14px 8px;text-align:center}
.stats div+div{box-shadow:inset 1px 0 0 var(--line-2)}
.stats b{display:block;font:700 22px/28px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font:400 12px/16px var(--font);color:var(--ink-3)}
.msg{display:flex;gap:12px;padding:14px 0;align-items:center;width:100%;cursor:pointer}
.msg+.msg{border-top:1px solid var(--line)}
.msg .t{flex:1;min-width:0}
.msg p{font:400 14px/20px var(--font);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.msg time{font:400 12px/16px var(--font);color:var(--ink-3)}
.unread{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font:600 11px/20px var(--font);text-align:center;margin-top:4px;flex:none}
#s-chat{padding:0}
.chat-head{position:absolute;top:0;left:0;right:0;padding:58px 16px 10px;background:var(--bar);backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--line);z-index:5;display:flex;align-items:center;gap:10px}
.chat-body{position:absolute;top:112px;bottom:88px;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.chat-body::-webkit-scrollbar{display:none}
.bubble{max-width:78%;padding:9px 13px;border-radius:18px;font:400 15px/21px var(--font);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);align-self:flex-start}
.bubble.me{align-self:flex-end;background:var(--brand);color:#fff;box-shadow:none}
.bubble small{display:block;font:400 11px/14px var(--font);opacity:.6;margin-top:2px;text-align:right}
.chat-in{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 34px;background:var(--bar);backdrop-filter:blur(20px);box-shadow:0 -1px 0 var(--line);display:flex;gap:8px;align-items:center}
.chat-in input{flex:1;height:42px;border-radius:21px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);padding:0 16px;outline:0;color:var(--ink)}
.chat-in .send{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
details{position:relative}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;font-weight:500}
summary::-webkit-details-marker{display:none}
summary svg{margin-left:auto;color:var(--ink-3);transition:transform .2s}
details[open] summary svg{transform:rotate(180deg)}
details p{padding:0 16px 16px;color:var(--ink-2)}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;padding:8px 8px 0;background:var(--bar);backdrop-filter:blur(20px);box-shadow:0 -1px 0 var(--line);display:flex;justify-content:space-around;align-items:flex-start;z-index:60}
.tabbar.hide{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px/13px var(--font);color:var(--ink-3);width:76px;padding-top:2px;white-space:nowrap;position:relative}
.tab.on{color:var(--brand-fg)}
.tab .cnt{position:absolute;top:-2px;left:42px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:600 10px/18px var(--font);padding:0 5px}
.tab.add .pl{width:44px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-bottom:-2px}
.tab.add{color:var(--ink-2);font-weight:600}

/* sheet + dialog + toast */
.modal{position:absolute;inset:0;background:var(--scrim);z-index:100;display:none;align-items:flex-end}
.modal.on{display:flex}
.modal.center{align-items:center;justify-content:center;padding:32px}
.sheet{background:var(--bg);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px var(--gutter) 40px;max-height:82%;overflow:auto;animation:up .22s ease;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.modal.center .sheet{border-radius:20px;padding:24px 20px 16px;animation:pop .18s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 18px}
.toast{position:absolute;bottom:112px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-md);font:var(--t-callout);z-index:130;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- v1.1 additions ---------- */
.card .bdg{position:absolute;top:10px;left:10px;display:flex;gap:4px;z-index:2}
.badge.vip{background:#2a2112;color:#f0c35a}
.badge.urgent,.badge.lostb{background:var(--red-50);color:var(--red);letter-spacing:0}

.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.svc-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.svc{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px/13px var(--font);color:var(--ink-2);text-align:center}
.svc i{width:52px;height:52px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--brand-fg)}
.lostbanner{display:flex;gap:14px;align-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-lg);padding:16px;margin-top:12px;width:100%;color:var(--ink)}
.lostbanner i{width:44px;height:44px;border-radius:12px;background:var(--red-50);color:var(--red);display:grid;place-items:center;flex:none}
.seg-sm{padding:2px}.seg-sm button{height:32px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.mapbox{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-lg);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.land{fill:var(--brand-50);stroke:var(--brand-fg);stroke-width:1.2;stroke-linejoin:round}
.pin{cursor:pointer;outline:none}.pin-hit{fill:transparent}.pin-dot{fill:var(--brand);stroke:var(--surface);stroke-width:2}.pin-num{fill:#fff;font:700 10px var(--font);pointer-events:none}
.pin:focus-visible .pin-dot{stroke:var(--gold);stroke-width:3}
.me{fill:var(--blue);stroke:var(--surface);stroke-width:2}.me-lbl{fill:var(--ink-2);font:600 10px var(--font)}
.vidbtn{position:absolute;left:16px;bottom:40px;z-index:3;display:flex;gap:6px;align-items:center;background:rgba(18,24,21,.72);color:#fff;font:600 13px/1 var(--font);padding:8px 12px;border-radius:99px}
.shop-cover{position:relative;height:200px;margin:-62px calc(-1 * var(--gutter)) 0}
.shop-cover>.photo{position:absolute;inset:0}
.shop-head{text-align:center;margin-top:-36px;position:relative;z-index:2}
.shop-logo{width:72px;height:72px;font-size:22px;margin:0 auto 8px;border-radius:20px;box-shadow:0 0 0 4px var(--bg);background:var(--brand);color:#fff}
.pad{margin-top:20px}
.rate{display:flex;gap:8px;justify-content:center}.rate button{color:var(--line)}.rate button.on{color:var(--gold)}
.fraud{display:flex;gap:10px;align-items:flex-start;background:var(--red-50);color:var(--red);border-radius:12px;padding:10px 12px;font:400 13px/18px var(--font);max-width:92%;align-self:center;margin:4px 0}
.fraud b{font-weight:600}.fraud .link{color:var(--red);font-size:13px;margin-top:4px}
.bubble.photo-b{padding:4px;background:var(--surface)}.bubble.photo-b.me{background:var(--brand)}
.bubble.photo-b small{padding:2px 6px}
.locb{display:flex;gap:8px;align-items:flex-start;color:inherit}
.chat-dock{position:absolute;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(20px);box-shadow:0 -1px 0 var(--line)}
.chat-dock .quick{padding:10px 12px 0;margin:0}.chat-dock .quick .chip{height:32px;font-size:13px}
.chat-dock .chat-in{position:static;background:none;box-shadow:none;backdrop-filter:none}
#s-chat .chat-body{bottom:136px}
.attach{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.walletcard{background:linear-gradient(135deg,#1e4d3a,#2f7d5d);color:#fff;border-radius:20px;padding:20px}
.walletrow{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-lg);padding:12px 14px;color:var(--ink)}
.walletrow>svg{color:var(--brand-fg)}
.verify-cta{display:flex;gap:12px;align-items:center;width:100%;background:var(--blue-50);color:var(--blue);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
.stepn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-2);font:600 13px/1 var(--font);flex:none}
.stepn.done{background:var(--green);color:#fff}
button.cell[disabled]{cursor:default}
.chartbox .chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--ink-3);font:500 11px var(--font)}

.chart .bar{fill:var(--brand)}
.chart .hit{fill:transparent}.chart .barg{cursor:pointer}.chart .barg:hover .bar{opacity:.8}
.picker{display:none}
.field label.cell{display:flex;margin:0;font:var(--t-body);font-weight:400}
