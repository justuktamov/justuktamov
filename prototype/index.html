<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Do'st — uy hayvonlari bozori (prototip)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ================= DESIGN TOKENS ================= */
:root{
  /* colour */
  --bg:#f4f4f1; --surface:#fff; --surface-2:#fafaf8;
  --ink:#121815; --ink-2:#4b5550; --ink-3:#8a928e; --line:#e5e5e0; --line-2:#efefeb;
  --brand:#1e4d3a; --brand-600:#276049; --brand-50:#ebf2ee; --brand-100:#d5e5dc;
  --gold:#94650f; --gold-50:#fbf3e1; --gold-200:#ecd7a5;
  --red:#c2372c;
  /* type — one family, clear scale */
  --font:"Inter",-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --t-display:700 28px/34px var(--font);
  --t-title:700 22px/28px var(--font);
  --t-headline:600 17px/24px var(--font);
  --t-body:400 15px/22px var(--font);
  --t-callout:500 14px/20px var(--font);
  --t-caption:500 12px/16px var(--font);
  /* shape */
  --r-sm:10px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  --shadow-float:0 8px 24px rgba(18,24,21,.10);
  --gutter:20px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(circle at 30% 20%,#2a332f,#0e1311 70%);font:var(--t-body);color:var(--ink);display:grid;place-items:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03"}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ================= DEVICE: iPhone 17 Pro Max (440×956pt) ================= */
#stage{width:476px;height:992px;transform-origin:center;flex:none}
.device{position:relative;width:476px;height:992px;border-radius:78px;padding:18px;
  background:linear-gradient(145deg,#d6d3cc,#8f8b84 40%,#c9c5bd 70%,#7d7972);
  box-shadow:0 0 0 2px #5c5953,0 40px 90px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.35)}
.device::before,.device::after{content:"";position:absolute;width:5px;background:#77736c;border-radius:3px}
.device::before{left:-4px;top:170px;height:60px;box-shadow:0 90px 0 #77736c,0 170px 0 #77736c}
.device::after{right:-4px;top:250px;height:110px}
.bezel{width:100%;height:100%;border-radius:62px;background:#000;padding:8px}
.phone{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:90}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;padding:19px 34px 0 44px;display:flex;justify-content:space-between;font:600 16px/20px var(--font);z-index:85;pointer-events:none;background:var(--bg);transition:background .2s}
.statusbar.dark{color:#fff;background:none}
.statusbar.clear{background:none}
.statusbar .r{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:90;pointer-events:none}

/* ================= LAYOUT ================= */
.screen{position:absolute;inset:0;overflow-y:auto;padding:62px var(--gutter) 120px;display:none;background:var(--bg)}
.screen.on{display:block;animation:fade .2s ease}
.screen::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* type roles */
.t-display{font:var(--t-display);letter-spacing:-.022em}
.t-title{font:var(--t-title);letter-spacing:-.018em}
.t-headline{font:var(--t-headline);letter-spacing:-.01em}
.t-callout{font:var(--t-callout)}
.t-caption{font:var(--t-caption)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}

/* ================= COMPONENTS ================= */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:var(--r-md);background:var(--brand);color:#fff;font:600 16px/20px var(--font);transition:background .15s,transform .1s}
.btn:active{transform:scale(.985);background:var(--brand-600)}
.btn.secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.gold{background:var(--gold)}
.btn.text{background:none;color:var(--brand);height:44px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn.float{box-shadow:var(--shadow-float);background:rgba(255,255,255,.95)}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:16px}
.nav .t-headline{flex:1}
.large-title{font:var(--t-display);letter-spacing:-.022em;margin:4px 0 16px}
.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.section a{font:var(--t-callout);color:var(--brand);font-weight:600;cursor:pointer}
.divider{height:1px;background:var(--line);margin:24px 0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter)}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:var(--t-callout);white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font:700 11px/1 var(--font);letter-spacing:.04em;background:var(--brand-50);color:var(--brand)}
.badge.top{background:var(--gold-50);color:var(--gold)}
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;font:var(--t-body);position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line-2)}
.cell .ic{color:var(--ink-2)}
.cell .val{margin-left:auto;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.cell .lbl{color:var(--ink-2)}
.cell .rt{margin-left:auto;font-weight:500}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;font:600 15px/1 var(--font);flex:none}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--brand-50);color:var(--brand);border-radius:var(--r-md);padding:12px 14px;font:var(--t-callout)}
.callout b{font-weight:600}
.photo{display:grid;place-items:center;background:linear-gradient(160deg,#eeece6,#e0ddd4);position:relative;overflow:hidden}
.photo .em{filter:saturate(.7) contrast(.95)}

/* listing card (grid) */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;cursor:pointer}
.card .photo{height:150px;font-size:64px}
.card .body{padding:12px 14px 14px}
.price{font:700 17px/22px var(--font);font-variant-numeric:tabular-nums}
.title{font:var(--t-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font:var(--t-caption);color:var(--ink-3);display:flex;align-items:center;gap:4px;margin-top:4px}
.save{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center}
.card .badge{position:absolute;top:10px;left:10px}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter) 2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{width:220px;flex:none}
/* listing row */
.lrow{display:flex;gap:14px;padding:14px 0;cursor:pointer;position:relative}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .photo{width:108px;height:108px;border-radius:var(--r-md);flex:none;font-size:46px}
.lrow .b{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .save{position:static;background:none;width:32px;height:32px;margin:-6px -6px 0 0}
.lrow .meta:last-child{margin-top:auto}

/* ================= SCREENS ================= */
/* welcome */
#s-welcome{padding:0;background:var(--surface)}
.w-hero{height:520px;background:var(--brand);position:relative;display:grid;place-items:center;overflow:hidden}
.w-hero::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.06);top:-120px;right:-200px}
.w-hero::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-90px;left:-110px}
.w-circle{width:240px;height:240px;border-radius:50%;background:#f1efe8;display:grid;place-items:center;font-size:130px;position:relative;z-index:1;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.w-logo{position:absolute;top:70px;left:24px;display:flex;align-items:center;gap:8px;color:#fff;font:700 18px/1 var(--font);z-index:1}
.w-logo i{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center}
.w-body{padding:28px 24px 0}
.w-list{margin:20px 0 28px;display:flex;flex-direction:column;gap:14px}
.w-list div{display:flex;gap:12px;align-items:center;font:var(--t-callout);color:var(--ink-2)}
.w-list i{width:32px;height:32px;border-radius:10px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:none}

/* home */
.loc{display:flex;align-items:center;gap:10px}
.loc .l1{font:var(--t-caption);color:var(--ink-3)}
.loc .l2{font:var(--t-headline);display:flex;align-items:center;gap:4px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-md);padding:0 6px 0 14px;height:48px;margin:16px 0 14px;color:var(--ink-3)}
.search input{flex:1;border:0;outline:0;background:none;font:var(--t-body);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search .f{width:36px;height:36px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.promo{display:flex;gap:14px;align-items:center;background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:16px;margin-top:24px;cursor:pointer}
.promo i{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.promo .t-headline{color:#fff}
.promo .t-caption{color:rgba(255,255,255,.72);font-weight:400;font-size:13px}

/* detail */
#s-detail{padding:0 0 150px}
.gal{height:390px;font-size:170px}
.gal .icon-btn{position:absolute;top:60px}
.pager{position:absolute;right:16px;bottom:40px;background:rgba(18,24,21,.6);color:#fff;font:var(--t-caption);padding:4px 10px;border-radius:99px}
.dsheet{background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;margin-top:-24px;position:relative;padding:24px var(--gutter) 0}
.cta{display:none;position:absolute;left:0;right:0;bottom:0;padding:12px var(--gutter) 34px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);box-shadow:0 -1px 0 var(--line);gap:10px;z-index:40}
.cta.on{display:flex}
.cta .btn.secondary{width:auto;padding:0 18px}

/* post */
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--brand)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{aspect-ratio:1;border-radius:var(--r-md);border:1.5px dashed #bfcbc4;background:var(--surface);display:grid;place-items:center;color:var(--brand);cursor:pointer;font:var(--t-caption);text-align:center}
.ph .in{display:flex;flex-direction:column;align-items:center;gap:6px}
.ph.filled{border:0;font-size:44px}
.ph.main{grid-column:span 2;grid-row:span 2}
.field label{display:block;font:var(--t-callout);font-weight:600;color:var(--ink);margin-bottom:8px}
.field .hint{font:var(--t-caption);color:var(--ink-3);margin-top:6px;font-weight:400}
.inp{width:100%;height:50px;border-radius:var(--r-md);border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);padding:0 14px;outline:0;font:var(--t-body);appearance:none}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{box-shadow:inset 0 0 0 2px var(--brand)}
textarea.inp{height:110px;padding:13px 14px;resize:none}
.suffix{position:relative}.suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:flex;background:#e9e9e4;border-radius:var(--r-md);padding:3px}
.seg button{flex:1;height:40px;border-radius:9px;font:var(--t-callout);color:var(--ink-2);text-align:center}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.success{text-align:center;padding-top:120px}
.success .ok{width:72px;height:72px;border-radius:50%;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;margin:0 auto 20px}

/* promote */
.plan{display:flex;gap:14px;align-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-lg);padding:16px;cursor:pointer}
.plan.on{box-shadow:inset 0 0 0 2px var(--gold);background:#fffcf5}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #c3c6c1;flex:none}
.plan.on .radio{box-shadow:inset 0 0 0 7px var(--gold)}
.plan .pr{margin-left:auto;text-align:right}
.benefit{display:flex;gap:12px;align-items:center;font:var(--t-body);color:var(--ink-2)}
.benefit svg{color:var(--brand)}

/* profile & messages */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:14px 8px;text-align:center}
.stats div+div{box-shadow:inset 1px 0 0 var(--line-2)}
.stats b{display:block;font:700 22px/28px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font:var(--t-caption);color:var(--ink-3);font-weight:400}
.msg{display:flex;gap:12px;padding:14px 0;align-items:center}
.msg+.msg{border-top:1px solid var(--line)}
.msg .t{flex:1;min-width:0}
.msg p{font:var(--t-callout);font-weight:400;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.msg time{font:var(--t-caption);color:var(--ink-3);font-weight:400}
.unread{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font:600 11px/20px var(--font);text-align:center;margin-top:4px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;padding:8px 8px 0;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);box-shadow:0 -1px 0 var(--line);display:flex;justify-content:space-around;align-items:flex-start;z-index:40}
.tabbar.hide{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px/13px var(--font);color:var(--ink-3);width:76px;padding-top:2px;white-space:nowrap}
.tab.on{color:var(--brand)}
.tab.add .pl{width:44px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-bottom:-2px}
.tab.add{color:var(--brand);font-weight:600}

/* sheet + toast */
.modal{position:absolute;inset:0;background:rgba(10,18,14,.45);z-index:95;display:none;align-items:flex-end}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px var(--gutter) 40px;max-height:80%;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:#cfcfc9;margin:0 auto 18px}
.opt.on{color:var(--brand);font-weight:600}
.toast{position:absolute;top:64px;left:50%;transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r-md);font:var(--t-callout);z-index:99;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="stage">
 <div class="device"><div class="bezel"><div class="phone" id="app">
  <div class="island"></div>
  <div class="statusbar" id="sb"><span class="num">9:41</span><span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0M4 7a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" fill="currentColor"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.2 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg>
  </span></div>
  <div class="toast" id="toast"></div>

  <section class="screen on" id="s-welcome"></section>
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-detail"></section>
  <section class="screen" id="s-fav"></section>
  <section class="screen" id="s-post"></section>
  <section class="screen" id="s-promote"></section>
  <section class="screen" id="s-messages"></section>
  <section class="screen" id="s-profile"></section>

  <nav class="tabbar hide" id="tabbar"></nav>
  <div class="cta" id="cta"></div>
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="home-ind"></div>
 </div></div></div>
</div>

<script>
/* ---------- icons: 24px grid, 1.75 stroke ---------- */
const P={
 home:'<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
 heart:'<path d="M12 19.5s-7.2-4.4-8.8-8.8C2 7.400 4 4.500 7 4.500c2 0 3.400 1.100 5 2.800 1.600-1.700 3-2.800 5-2.800 3 0 5 2.900 3.800 6.200-1.600 4.400-8.800 8.800-8.800 8.800z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 chat:'<path d="M20 11.500a7.500 7.500 0 0 1-11 6.600L4.500 19.500l1.300-4A7.500 7.500 0 1 1 20 11.500z"/>',
 user:'<circle cx="12" cy="8" r="3.600"/><path d="M5 20c.9-3.600 3.600-5.500 7-5.500s6.100 1.900 7 5.500"/>',
 search:'<circle cx="11" cy="11" r="6.500"/><path d="m20 20-4.200-4.200"/>',
 pin:'<path d="M12 21s6.500-5.700 6.500-11a6.500 6.500 0 0 0-13 0c0 5.300 6.500 11 6.500 11z"/><circle cx="12" cy="10" r="2.300"/>',
 chev:'<path d="m7 10 5 5 5-5"/>', right:'<path d="m10 6 6 6-6 6"/>', back:'<path d="m15 5-7 7 7 7"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
 bell:'<path d="M6 16.500V11a6 6 0 0 1 12 0v5.500l1.500 1.500h-15zM10 21h4"/>',
 star:'<path d="m12 3.500 2.600 5.300 5.800.8-4.200 4.100 1 5.800L12 16.800l-5.200 2.700 1-5.800-4.200-4.100 5.800-.8z"/>',
 phone:'<path d="M6 4h3l1.500 4.500-2 1.200a10.500 10.500 0 0 0 5.800 5.800l1.200-2L20 15v3a2 2 0 0 1-2 2A15 15 0 0 1 4 6a2 2 0 0 1 2-2z"/>',
 shield:'<path d="M12 3.500 19 6v5.500c0 4.600-3 7.600-7 9-4-1.400-7-4.400-7-9V6z"/><path d="m9 12 2 2 4-4"/>',
 flag:'<path d="M5.500 21V4.500M5.500 4.500h11l-2 4 2 4h-11"/>',

/* ---------- Uzbek typography: oʻ gʻ (U+02BB) and tutuq belgisi ʼ (U+02BC) ---------- */
const uz=s=>s.replace(/([oOgG])'/g,'$1ʻ').replace(/(\p{L})'(\p{L})/gu,'$1ʼ$2');
function typeset(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(n.nodeValue.includes("'")){const v=uz(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}}
  root.querySelectorAll?.('[placeholder]').forEach(e=>{const v=uz(e.placeholder);if(v!==e.placeholder)e.placeholder=v});
}
new MutationObserver(()=>typeset($('#app'))).observe($('#app'),{childList:true,subtree:true});

   <div class="benefit">${ic('star',22)}"TOP" belgisi bilan ajralib turadi</div>
  </div>
  <div class="stack" style="gap:10px">${PLANS.map((p,i)=>`<div class="plan ${plan===i?'on':''}" onclick="plan=${i};openPromote()"><span class="radio"></span>
   <div><div class="t-headline">${p.t}</div>${p.hot?'<div class="t-caption" style="color:var(--gold)">Eng ko\'p tanlanadi</div>':''}</div>
   <div class="pr"><div class="price" style="font-size:16px">${fmt(p.p)}</div><div class="t-caption faint num" style="font-weight:400">${Math.round(p.p/p.d).toLocaleString('ru-RU')} so'm / kun</div></div></div>`).join('')}</div>

  <button class="btn gold" onclick="toast('E\\'lon TOP ga chiqarildi');go('home')">To'lash · ${fmt(PLANS[plan].p)}</button>`;
  go('promote');
}

  .map(m=>`<div class="msg"><div class="avatar">${m[4]}</div><div class="t"><div class="row between"><b style="font-weight:600">${m[0]}</b><time class="num">${m[2]}</time></div>
   <div class="row between" style="align-items:flex-start"><p>${m[1]}</p>${m[3]?`<span class="unread">${m[3]}</span>`:''}</div></div></div>`).join('')}

   <div style="flex:1"><div class="t-headline">Uchqun Uktamov</div><div class="muted num t-callout" style="font-weight:400">+998 90 123 45 67</div></div>${ic('right',20,{c:'var(--ink-3)'})}</div>
  <div class="group stats"><div><b>3</b><span>Faol e'lon</span></div><div><b>128</b><span>Ko'rishlar</span></div><div><b>14</b><span>Qo'ng'iroqlar</span></div></div>

   <div style="flex:1;min-width:0"><div class="title">${a.n}</div><div class="t-caption faint num" style="font-weight:400;margin-top:2px">${fmt(a.p)}</div></div>
   ${a.top?topBadge:`<button class="chip" style="height:32px;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-200)" onclick="event.stopPropagation();openPromote()">${ic('star',14,{fill:1})}TOP</button>`}</div>`).join('')}</div>
  <div class="section"><h2 class="t-headline">Sozlamalar</h2></div>
  <div class="group">
   <button class="cell" onclick="toast('Tez orada')"><span class="ic">${ic('card',20)}</span>To'lovlar tarixi<span class="val">${ic('right',18)}</span></button>
   <button class="cell" onclick="toast('Tez orada')"><span class="ic">${ic('bell',20)}</span>Bildirishnomalar<span class="val">${ic('right',18)}</span></button>
   <button class="cell" onclick="toast('Tez orada')"><span class="ic">${ic('globe',20)}</span>Til<span class="val">O'zbekcha ${ic('right',18)}</span></button>

/* ---------- fit device to window ---------- */
function fit(){const s=Math.min(1,(innerHeight-24)/992,(innerWidth-16)/476);$('#stage').style.transform=`scale(${s})`;$('#stage').style.margin=`${(992*s-992)/2}px ${(476*s-476)/2}px`}
addEventListener('resize',fit);fit();
go('welcome');
</script>
